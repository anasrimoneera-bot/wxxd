name: Build Auto-Favorite

# Runs the same build.bat the owner runs on their PC, the way a fresh PC would:
# it installs its private Python, builds Auto-Favorite.exe, and the exe is smoke-tested.

on:
  push:
    branches: [main]
    paths: ["tools/wx-shop-follow/**", ".github/workflows/auto-favorite.yml"]
  pull_request:
    paths: ["tools/wx-shop-follow/**", ".github/workflows/auto-favorite.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: build.bat (fresh-PC path, private Python)
        shell: cmd
        env:
          AF_NOPAUSE: "1"
          AF_FORCE_PRIVATE: "1"
        run: call tools\wx-shop-follow\build.bat

      - name: Smoke test (window + bundled OCR)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath Auto-Favorite\Auto-Favorite.exe -ArgumentList "--smoke" -Wait -PassThru
          Get-Content Auto-Favorite\smoke.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: build.bat again (reuses the private Python)
        shell: cmd
        env:
          AF_NOPAUSE: "1"
          AF_FORCE_PRIVATE: "1"
        run: call tools\wx-shop-follow\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: Auto-Favorite
          path: Auto-Favorite/Auto-Favorite.exe

      - name: Publish to the "auto-favorite" release (optional download)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view auto-favorite >/dev/null 2>&1 || \
            gh release create auto-favorite --title "Auto-Favorite" --latest=false \
              --notes "Auto-Favorite.exe (Windows). Normally build it on your PC with deploy.bat [B] or tools/wx-shop-follow/build.bat."
          gh release upload auto-favorite Auto-Favorite/Auto-Favorite.exe --clobber
