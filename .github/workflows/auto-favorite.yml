name: Build Auto-Favorite

# Runs the same build.bat the owner runs on their PC, the way a fresh PC would:
# from a project folder with Chinese characters in its path (like E:\表格处理\微信小店),
# installing its private Python, then the built Auto-Favorite.exe is smoke-tested.

on:
  push:
    branches: [main]
    paths: ["tools/wx-shop-follow/**", "deploy.bat", ".github/workflows/auto-favorite.yml"]
  pull_request:
    paths: ["tools/wx-shop-follow/**", "deploy.bat", ".github/workflows/auto-favorite.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: build.bat from a Chinese project path, no curl, broken PATH (fresh private Python via PowerShell download)
        shell: pwsh
        env:
          AF_NOPAUSE: "1"
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "表格处理\微信小店"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          robocopy . $dst /E /XD .git /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit 1 }
          Push-Location $dst
          # like the owner's PC: no curl, and System32 missing from PATH (build.bat must cope)
          $env:AF_NO_CURL = "1"
          cmd /c 'set "PATH=C:\Windows\System32\OpenSSH" && call "tools\wx-shop-follow\build.bat"'
          $rc = $LASTEXITCODE
          Pop-Location
          if (Test-Path C:\AutoFavoriteBuild\build.log) { Get-Content C:\AutoFavoriteBuild\build.log -Tail 15 }
          if ($rc -ne 0) { exit $rc }
          if (-not (Test-Path (Join-Path $dst "Auto-Favorite\Auto-Favorite.exe"))) { Write-Error "exe not copied to the project folder"; exit 1 }
          Copy-Item (Join-Path $dst "Auto-Favorite") -Destination . -Recurse -Force

      - name: Smoke test (window + bundled OCR)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath Auto-Favorite\Auto-Favorite.exe -ArgumentList "--smoke" -Wait -PassThru
          Get-Content Auto-Favorite\smoke.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: build.bat again by full path, like deploy.bat [B] (reuses the private Python)
        shell: cmd
        env:
          AF_NOPAUSE: "1"
        run: call "%CD%\tools\wx-shop-follow\build.bat"

      - uses: actions/upload-artifact@v4
        with:
          name: Auto-Favorite
          path: Auto-Favorite/Auto-Favorite.exe

      - name: Publish to the "auto-favorite" release (optional download)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view auto-favorite >/dev/null 2>&1 || \
            gh release create auto-favorite --title "Auto-Favorite" --latest=false \
              --notes "Auto-Favorite.exe (Windows). Normally build it on your PC with deploy.bat [B] or tools/wx-shop-follow/build.bat."
          gh release upload auto-favorite Auto-Favorite/Auto-Favorite.exe --clobber
