# /etc/nginx/sites-available/wxxd
# Suggested subdomain: wxxd.b2bsxlj.com (DNS: A record -> the server's EIP).
# This file is an ADDITIONAL server block: it does not touch the existing
# www / app / erp / finance sites on the same server.
# Certificate: sudo certbot --nginx -d wxxd.b2bsxlj.com
# If you changed APP_PORT in .env, change 8000 below to match.
server {
    listen 80;
    server_name wxxd.b2bsxlj.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name wxxd.b2bsxlj.com;
    ssl_certificate     /etc/letsencrypt/live/wxxd.b2bsxlj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wxxd.b2bsxlj.com/privkey.pem;
    client_max_body_size 200m;   # product data package uploads
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
