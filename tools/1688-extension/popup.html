<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { width: 380px; margin: 0; font: 13px/1.5 -apple-system, "Microsoft YaHei", sans-serif; color: #303133; }
  header { background: #ff6a00; color: #fff; padding: 10px 14px; font-weight: 600; }
  section { padding: 10px 14px; border-bottom: 1px solid #eee; }
  label { display: block; color: #606266; margin: 6px 0 2px; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #dcdfe6; border-radius: 4px; }
  button { padding: 6px 12px; border: 0; border-radius: 4px; background: #409eff; color: #fff; cursor: pointer; }
  button.plain { background: #f4f4f5; color: #606266; }
  .row { display: flex; gap: 6px; align-items: center; }
  .muted { color: #909399; font-size: 12px; }
  .err { color: #f56c6c; font-size: 12px; }
  .item { display: flex; gap: 8px; padding: 6px; border-radius: 4px; cursor: pointer; align-items: center; }
  .item:hover { background: #f5f7fa; }
  .item.on { background: #ecf5ff; outline: 1px solid #409eff; }
  .item img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .item .t { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #list { max-height: 300px; overflow-y: auto; margin-top: 6px; }
  .cur { display: flex; gap: 8px; align-items: center; }
  .cur img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; }
  .item input[type=checkbox] { width: auto; margin: 0; }
  .st { font-size: 12px; padding: 0 6px; border-radius: 8px; white-space: nowrap; }
  .st.waiting, .st.searching, .st.uploaded { background: #ecf5ff; color: #409eff; }
  .st.confirm { background: #fdf6ec; color: #e6a23c; } .st.done { background: #f0f9eb; color: #67c23a; }
  .st.nomatch, .st.error { background: #fef0f0; color: #f56c6c; }
  .bar { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-top: 6px; }
</style>
</head>
<body>
<header>1688 货源助手</header>

<section id="login">
  <label>网站地址</label><input id="server" placeholder="https://你的网站地址">
  <label>账号</label><input id="username">
  <label>密码</label><input id="password" type="password">
  <div class="row" style="margin-top:8px"><button id="doLogin">登录</button><span id="loginErr" class="err"></span></div>
</section>

<section id="main" hidden>
  <div class="row" style="justify-content: space-between">
    <span class="muted">已登录：<b id="who"></b></span><button class="plain" id="logout">退出</button>
  </div>
  <div id="current" style="margin-top:8px"></div>
</section>

<section id="batchBox" hidden>
  <div class="bar"><b>批量找货源 <span id="batchSum" class="muted"></span></b><button class="plain" id="batchClear">清除</button></div>
  <div id="batchList" style="max-height: 220px; overflow-y: auto"></div>
</section>

<section id="pick" hidden>
  <div class="row">
    <select id="kind" style="width: 110px"><option value="store">店铺商品</option><option value="library">商品云库</option></select>
    <select id="store" style="flex:1"><option value="">全部店铺</option></select>
  </div>
  <div class="row" style="margin-top:6px">
    <input id="q" placeholder="搜索标题 / 商品ID（留空：还没有货源的商品）"><button id="search">搜索</button>
  </div>
  <div class="bar"><label style="margin:0"><input type="checkbox" id="checkAll" style="width:auto"> 全选前 10 个</label>
    <button id="batchGo" disabled>批量找货源（0）</button></div>
  <div id="list"></div>
  <p class="muted">勾选最多 10 个商品，点「批量找货源」：打开 1688 找品页，一次上传 10 个主图（批量图搜），大图模式下逐个点每张图识别、AI 核对，选出最优货源；在面板里点「打开最优」，核对规格价格后点「设为货源」。</p>
</section>
<script src="popup.js"></script>
</body>
</html>
